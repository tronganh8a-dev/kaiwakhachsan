
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a2e4a;--navy2:#243d5e;--gold:#b8872a;--gold-bg:#fdf3e0;
  --jade:#1a6b5a;--jade-bg:#e6f4f0;
  --red:#b03030;--red-bg:#fdf0f0;
  --purple:#5a3ea0;--purple-bg:#f0ecfc;
  --amber:#8a5c10;--amber-bg:#fef7e6;
  --t:var(--color-text-primary);--tm:var(--color-text-secondary);
  --bg:var(--color-background-primary);--bg2:var(--color-background-secondary);
  --bd:var(--color-border-tertiary);--bd2:var(--color-border-secondary);
  --jp:'Noto Sans JP',sans-serif;--vn:'Be Vietnam Pro',sans-serif;
  --r:var(--border-radius-md);--rl:var(--border-radius-lg)
}
body,#app{font-family:var(--vn)}

.topbar{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;border-radius:var(--rl) var(--rl) 0 0}
.topbar-icon{font-size:22px}
.topbar-info{flex:1}
.topbar-title{font-size:15px;font-weight:600}
.topbar-sub{font-size:11px;opacity:.65;font-family:var(--jp);margin-top:2px}
.stat-pill{background:rgba(255,255,255,.13);border-radius:99px;padding:3px 10px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:5px}

.filter-bar{display:flex;gap:6px;padding:10px 14px;border-bottom:.5px solid var(--bd);background:var(--bg2);flex-wrap:wrap;align-items:center}
.filter-label{font-size:11px;color:var(--tm);margin-right:2px}
.fbtn{padding:4px 11px;border-radius:99px;font-size:11px;font-weight:500;cursor:pointer;border:.5px solid var(--bd2);background:var(--bg);color:var(--tm);transition:.15s}
.fbtn:hover{border-color:var(--navy);color:var(--navy)}
.fbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.progress-wrap{margin-left:auto;display:flex;align-items:center;gap:8px}
.prog-bar{width:100px;height:5px;background:var(--bd2);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
.prog-txt{font-size:11px;color:var(--tm);white-space:nowrap}

.arena{padding:14px 16px}

.situation-card{border:.5px solid var(--bd2);border-radius:var(--rl);overflow:hidden;margin-bottom:14px}
.sit-header{padding:10px 14px;display:flex;align-items:center;gap:10px}
.sit-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.sit-cat{font-size:10px;font-weight:700;letter-spacing:.07em;padding:2px 8px;border-radius:99px}
.sit-title{font-size:13px;font-weight:600;color:var(--t);flex:1}
.sit-diff{font-size:10px;padding:2px 7px;border-radius:99px;font-weight:600}
.diff-1{background:#e8f4f8;color:#1a5a7a}
.diff-2{background:var(--amber-bg);color:var(--amber)}
.diff-3{background:var(--red-bg);color:var(--red)}

.customer-bubble{margin:0 14px 12px;padding:10px 13px;background:var(--amber-bg);border-radius:var(--r);border-left:3px solid var(--gold)}
.bubble-label{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--amber);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.bubble-jp{font-family:var(--jp);font-size:15px;color:var(--t);line-height:1.8}
.ruby-wrap ruby{font-family:var(--jp)}
.ruby-wrap ruby rt{font-size:9px;color:var(--tm);font-family:var(--jp)}
.bubble-vn{font-size:11px;color:var(--tm);margin-top:4px}

.answer-zone{margin:0 14px 12px}
.answer-prompt{font-size:12px;color:var(--tm);margin-bottom:7px;display:flex;align-items:center;gap:5px}
.answer-input{width:100%;border:.5px solid var(--bd2);border-radius:var(--r);padding:9px 11px;font-family:var(--jp);font-size:14px;color:var(--t);background:var(--bg);resize:none;min-height:60px;transition:.15s}
.answer-input:focus{outline:none;border-color:var(--navy)}
.answer-input:disabled{background:var(--bg2);color:var(--tm)}

.hint-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.hint-chip{padding:4px 10px;border-radius:99px;font-size:11px;font-family:var(--jp);border:.5px dashed var(--bd2);color:var(--tm);cursor:pointer;background:var(--bg)}
.hint-chip:hover{border-color:var(--purple);color:var(--purple)}
.hint-chip.used{background:var(--purple-bg);color:var(--purple);border-color:var(--purple)}

.btn-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.btn-show{padding:7px 15px;background:var(--navy);color:#fff;border:none;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--vn)}
.btn-skip{padding:7px 12px;background:var(--bg);color:var(--tm);border:.5px solid var(--bd2);border-radius:var(--r);font-size:12px;cursor:pointer;font-family:var(--vn)}
.btn-hint{padding:7px 12px;background:var(--bg);color:var(--purple);border:.5px solid var(--purple);border-radius:var(--r);font-size:12px;cursor:pointer;font-family:var(--vn)}
.btn-next{padding:7px 16px;background:var(--jade);color:#fff;border:none;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--vn);margin-left:auto}

.model-answer{margin:0 14px 12px;border:.5px solid var(--bd2);border-radius:var(--r);overflow:hidden;display:none}
.model-answer.show{display:block}
.ma-header{background:var(--jade);padding:7px 12px;font-size:11px;font-weight:700;color:#fff;letter-spacing:.05em;display:flex;justify-content:space-between;align-items:center}
.ma-body{padding:10px 12px}
.ma-jp{font-family:var(--jp);font-size:14px;color:var(--t);line-height:1.9;margin-bottom:5px}
.ma-vn{font-size:12px;color:var(--tm);line-height:1.6;margin-bottom:8px}
.ma-notes{display:flex;flex-direction:column;gap:5px}
.ma-note{font-size:11px;padding:5px 9px;border-radius:var(--r);display:flex;align-items:flex-start;gap:6px}
.note-keigo{background:var(--purple-bg);color:var(--purple)}
.note-tip{background:var(--jade-bg);color:var(--jade)}
.note-warn{background:var(--red-bg);color:var(--red)}

.score-anim{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--jade-bg);color:var(--jade);margin-left:auto}

.nav-end{padding:10px 14px;border-top:.5px solid var(--bd);background:var(--bg2);display:flex;align-items:center;justify-content:space-between}
.done-banner{background:var(--jade-bg);border:.5px solid var(--jade);border-radius:var(--r);padding:12px 14px;text-align:center;margin-bottom:12px}
.done-banner h3{font-size:15px;color:var(--jade);margin-bottom:4px}
.done-banner p{font-size:12px;color:var(--tm)}
</style>

let filtered = [...ALL];
let revealed = {};
let usedHints = {};
let score = 0;
let doneSet = new Set();
let currentFilter = 'all';

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('on'));
  event.target.classList.add('on');
  filtered = f === 'all' ? [...ALL] : ALL.filter(x => x.cat === f);
  render();
}

function render() {
  document.getElementById('totalcount').textContent = filtered.length;
  document.getElementById('donecount').textContent = [...doneSet].filter(id => filtered.find(x=>x.id===id)).length;
  const pct = filtered.length ? Math.round([...doneSet].filter(id=>filtered.find(x=>x.id===id)).length/filtered.length*100) : 0;
  document.getElementById('progfill').style.width = pct + '%';
  document.getElementById('progtxt').textContent = pct + '%';
  document.getElementById('sc').textContent = score;

  const catColors = {checkin:'#1a2e4a',yoyaku:'#1a6b5a',cancel:'#b03030',info:'#5a3ea0',trouble:'#8a5c10'};
  const catNames = {checkin:'Check-in',yoyaku:'Đặt phòng',cancel:'Hủy/Đổi',info:'Hỏi info',trouble:'Xử lý sự cố'};
  const diffLabel = ['','Cơ bản','Trung cấp','Nâng cao'];
  const diffCls = ['','diff-1','diff-2','diff-3'];

  let html = '';
  if(filtered.length === 0){html='<p style="color:var(--tm);font-size:13px;padding:1rem">Không có tình huống nào.</p>';}
  filtered.forEach(sc => {
    const isRevealed = revealed[sc.id];
    const isDone = doneSet.has(sc.id);
    const hKey = sc.id;
    const usedH = usedHints[hKey] || [];

    const hintHTML = sc.hints.map((h,hi) => {
      const u = usedH.includes(hi);
      return `<span class="hint-chip ${u?'used':''}" onclick="useHint(${sc.id},${hi})">${u ? h : '?'} <i class="ti ti-eye" style="font-size:11px" aria-hidden="true"></i></span>`;
    }).join('');

    const noteHTML = (isRevealed ? sc.answer.notes.map(n =>
      `<div class="ma-note note-${n.type}"><i class="ti ti-${n.type==='keigo'?'award':n.type==='warn'?'alert-triangle':'bulb'}" style="font-size:13px;flex-shrink:0" aria-hidden="true"></i><span>${n.text}</span></div>`
    ).join('') : '');

    html += `<div class="situation-card" id="card-${sc.id}">
      <div class="sit-header" style="background:${isDone?'var(--jade-bg)':'var(--bg2)'}">
        <div class="sit-num" style="background:${catColors[sc.cat]};color:#fff">${sc.id}</div>
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
            <span class="sit-cat" style="background:${catColors[sc.cat]}22;color:${catColors[sc.cat]}">${catNames[sc.cat]}</span>
            <span class="sit-diff ${diffCls[sc.diff]}">${diffLabel[sc.diff]}</span>
            <span class="sit-title">${sc.title}</span>
          </div>
        </div>
        ${isDone ? `<span style="font-size:12px;color:var(--jade);font-weight:600"><i class="ti ti-circle-check" style="font-size:14px;vertical-align:-2px" aria-hidden="true"></i> Xong</span>` : ''}
      </div>

      <div class="customer-bubble">
        <div class="bubble-label"><i class="ti ti-user-circle" style="font-size:13px" aria-hidden="true"></i> KHÁCH NÓI</div>
        <div class="bubble-jp ruby-wrap">${sc.customer.jp}</div>
        <div class="bubble-vn">${sc.customer.vn}</div>
      </div>

      <div class="answer-zone">
        <div class="answer-prompt"><i class="ti ti-pencil" style="font-size:13px" aria-hidden="true"></i> Bạn (nhân viên) sẽ trả lời thế nào?</div>
        <textarea class="answer-input" id="inp-${sc.id}" placeholder="Nhập câu trả lời tiếng Nhật của bạn tại đây..." ${isRevealed?'disabled':''}>${isRevealed ? sc.answer.jp.replace(/<[^>]+>/g,'') : ''}</textarea>
        <div style="margin-bottom:8px">
          <div style="font-size:11px;color:var(--tm);margin-bottom:5px"><i class="ti ti-bulb" style="font-size:12px" aria-hidden="true"></i> Gợi ý từ vựng (nhấn để hiện):</div>
          <div class="hint-chips">${hintHTML}</div>
        </div>
        <div class="btn-row">
          ${!isRevealed ? `<button class="btn-show" onclick="reveal(${sc.id})"><i class="ti ti-eye" style="font-size:13px;vertical-align:-1px" aria-hidden="true"></i> Xem đáp án</button>` : `<button class="btn-show" style="background:var(--jade)" onclick="markDone(${sc.id})"><i class="ti ti-check" style="font-size:13px;vertical-align:-1px" aria-hidden="true"></i> Đúng rồi! +${10-usedH.length*2}đ</button>`}
          <button class="btn-hint" onclick="revealAllHints(${sc.id})"><i class="ti ti-eye-table" style="font-size:13px;vertical-align:-1px" aria-hidden="true"></i> Xem tất cả gợi ý</button>
          <button class="btn-skip" onclick="scrollToNext(${sc.id})">Bỏ qua <i class="ti ti-arrow-down" style="font-size:12px;vertical-align:-1px" aria-hidden="true"></i></button>
        </div>
      </div>

      <div class="model-answer ${isRevealed?'show':''}" id="ma-${sc.id}">
        <div class="ma-header">
          <span><i class="ti ti-check-circle" style="font-size:13px;vertical-align:-1px" aria-hidden="true"></i> Đáp án chuẩn</span>
          ${isDone ? '<span style="font-size:11px;opacity:.8">Đã hoàn thành</span>' : ''}
        </div>
        <div class="ma-body">
          <div class="ma-jp ruby-wrap">${sc.answer.jp}</div>
          <div class="ma-vn">${sc.answer.vn}</div>
          <div class="ma-notes">${noteHTML}</div>
        </div>
      </div>
    </div>`;
  });

  document.getElementById('arena').innerHTML = html;
}

function useHint(sid, hi) {
  if(!usedHints[sid]) usedHints[sid] = [];
  if(!usedHints[sid].includes(hi)) usedHints[sid].push(hi);
  render();
}

function revealAllHints(sid) {
  const sc = ALL.find(x=>x.id===sid);
  usedHints[sid] = sc.hints.map((_,i)=>i);
  render();
}

function reveal(sid) {
  revealed[sid] = true;
  render();
  setTimeout(()=>{
    const ma = document.getElementById('ma-'+sid);
    if(ma) ma.scrollIntoView({behavior:'smooth',block:'center'});
  },100);
}

function markDone(sid) {
  if(!doneSet.has(sid)) {
    doneSet.add(sid);
    const used = (usedHints[sid]||[]).length;
    const pts = Math.max(2, 10 - used*2);
    score += pts;
  }
  render();
}

function scrollToNext(sid) {
  const idx = filtered.findIndex(x=>x.id===sid);
  if(idx < filtered.length-1) {
    const nextId = filtered[idx+1].id;
    const el = document.getElementById('card-'+nextId);
    if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  }
}

render();
</script>
