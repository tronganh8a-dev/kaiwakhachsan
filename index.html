let currentScenario = 0;
let currentStep = 0;
let scores = [0, 0, 0];
let completed = [false, false, false];
let quizAnswered = [[false,false,false],[false,false,false],[false,false,false]];
let revealedRoleplay = {};

function updateProgress() {
  const done = completed.filter(Boolean).length;
  document.getElementById('prog-fill').style.width = (done/3*100) + '%';
  document.getElementById('prog-label').textContent = done + ' / 3 xong';
  document.getElementById('score-display').textContent = scores.reduce((a,b)=>a+b,0);
}

function switchScenario(idx) {
  currentScenario = idx;
  currentStep = 0;
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', i === idx);
    t.classList.toggle('completed', completed[i]);
  });
  renderContent();
}

function renderContent() {
  const sc = scenarios[currentScenario];
  const s = currentStep;
  const cont = document.getElementById('main-content');

  let stepsHTML = `<div class="step-nav">`;
  ['Học từ vựng','Mẫu câu','Hội thoại mẫu','Luyện tập','Roleplay'].forEach((name, i) => {
    const cls = i === s ? 'active' : (i < s ? 'done' : '');
    stepsHTML += `<button class="step-btn ${cls}" onclick="goStep(${i})">${i+1}. ${name}</button>`;
  });
  stepsHTML += `</div>`;

  let bodyHTML = '';

  if (s === 0) {
    bodyHTML = renderVocab(sc);
  } else if (s === 1) {
    bodyHTML = renderPatterns(sc);
  } else if (s === 2) {
    bodyHTML = renderDialog(sc);
  } else if (s === 3) {
    bodyHTML = renderQuiz(sc);
  } else if (s === 4) {
    bodyHTML = renderRoleplay(sc);
  }

  cont.innerHTML = `
    ${renderScenarioHeader(sc)}
    ${stepsHTML}
    ${bodyHTML}
  `;
}

function renderScenarioHeader(sc) {
  return `<div class="scenario-header">
    <div class="scenario-emoji"><i class="ti ${sc.icon}" aria-hidden="true"></i></div>
    <div>
      <div class="scenario-title">${sc.title}</div>
      <div class="scenario-jp">${sc.jp}</div>
      <div class="scenario-desc">${sc.desc}</div>
    </div>
    ${scores[sc.id] > 0 ? `<div style="margin-left:auto"><span class="score-badge"><i class="ti ti-star" style="font-size:12px"></i> ${scores[sc.id]}đ</span></div>` : ''}
  </div>`;
}

function renderVocab(sc) {
  let cards = sc.vocab.map((v,i) => `
    <div class="vocab-card" id="vc-${sc.id}-${i}" onclick="flipVocab(${sc.id},${i})">
      <div class="flip-hint">nhấn</div>
      <div class="jp">${v.jp}</div>
      <div class="vn">${v.vn}</div>
    </div>
  `).join('');
  return `
    <div class="learn-section">
      <div class="section-label"><i class="ti ti-vocabulary" aria-hidden="true"></i> TỪ VỰNG TRỌNG TÂM — nhấn để ghi nhớ</div>
      <div class="tip-box"><strong>Mẹo:</strong> Nhấn vào thẻ để lật và kiểm tra bạn có nhớ nghĩa không nhé!</div>
      <div class="vocab-grid">${cards}</div>
    </div>
    <div class="action-row"><button class="btn-primary" onclick="goStep(1)">Tiếp theo: Mẫu câu →</button></div>
  `;
}

function flipVocab(sid, idx) {
  const el = document.getElementById(`vc-${sid}-${idx}`);
  el.classList.toggle('flipped');
}

function renderPatterns(sc) {
  let rows = sc.patterns.map(p => `
    <tr>
      <td class="jp-cell">${p.jp}</td>
      <td class="vn-cell">${p.vn}</td>
    </tr>
  `).join('');
  return `
    <div class="learn-section">
      <div class="section-label"><i class="ti ti-message-circle-2" aria-hidden="true"></i> MẪU CÂU KÍNH NGỮ</div>
      <div class="tip-box"><strong>Lưu ý:</strong> Trong khách sạn Nhật Bản, luôn dùng <strong>丁寧語・尊敬語・謙譲語</strong>. Tránh dùng thể thông thường.</div>
      <table class="pattern-table">
        <thead><tr><th style="width:55%">Tiếng Nhật (kính ngữ)</th><th>Ý nghĩa tiếng Việt</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="action-row">
      <button class="btn-secondary" onclick="goStep(0)">← Từ vựng</button>
      <button class="btn-primary" onclick="goStep(2)">Tiếp theo: Hội thoại →</button>
    </div>
  `;
}

function renderDialog(sc) {
  let rows = sc.dialog.map(d => `
    <div class="dialog-row ${d.role.toLowerCase()}">
      <div class="role-badge">${d.role}</div>
      <div class="dialog-content">
        <div class="jp">${d.jp}</div>
        <div class="vn">${d.vn}</div>
      </div>
    </div>
  `).join('');
  return `
    <div class="learn-section">
      <div class="section-label"><i class="ti ti-users" aria-hidden="true"></i> HỘI THOẠI MẪU — đọc kỹ trước khi luyện</div>
      <div class="tip-box"><strong>Gợi ý:</strong> Đọc to hội thoại này ít nhất 2 lần trước khi chuyển sang phần luyện tập nhé!</div>
      <div class="dialog-box">
        <div class="dialog-header">NV = Nhân viên &nbsp;|&nbsp; KH = Khách hàng</div>
        ${rows}
      </div>
    </div>
    <div class="action-row">
      <button class="btn-secondary" onclick="goStep(1)">← Mẫu câu</button>
      <button class="btn-primary" onclick="goStep(3)">Luyện tập →</button>
    </div>
  `;
}

function renderQuiz(sc) {
  let qHTML = sc.quiz.map((q, qi) => renderQuestion(sc, qi)).join('');
  return `
    <div class="learn-section">
      <div class="section-label"><i class="ti ti-pencil" aria-hidden="true"></i> LUYỆN TẬP — kiểm tra hiểu bài</div>
      ${qHTML}
    </div>
    <div class="action-row">
      <button class="btn-secondary" onclick="goStep(2)">← Hội thoại</button>
      <button class="btn-gold" onclick="goStep(4)">Roleplay thực tế →</button>
    </div>
  `;
}

function renderQuestion(sc, qi) {
  const q = sc.quiz[qi];
  const done = quizAnswered[sc.id][qi];
  if (q.type === 'choice') {
    let opts = q.options.map((o, oi) => {
      let cls = '';
      if (done) {
        if (oi === q.answer) cls = 'correct';
        else if (window[`chosen_${sc.id}_${qi}`] === oi) cls = 'wrong';
      }
      return `<button class="option-btn ${cls}" ${done?'disabled':''} onclick="answerChoice(${sc.id},${qi},${oi})">${o}</button>`;
    }).join('');
    return `
      <div style="margin-bottom:1rem">
        <div class="quiz-question">${q.q}</div>
        <div class="quiz-hint">${q.hint}</div>
        <div class="options-grid">${opts}</div>
        <div class="feedback-msg ${done?'show':''}  ${done && window[`chosen_${sc.id}_${qi}`]===q.answer?'ok':'wrong'}" id="fb-${sc.id}-${qi}">
          ${done ? (window[`chosen_${sc.id}_${qi}`]===q.answer ? '✓ Chính xác! +10 điểm' : `✗ Chưa đúng. Đáp án: ${q.options[q.answer]}`) : ''}
        </div>
      </div>`;
  } else {
    const val = window[`fill_${sc.id}_${qi}`] || '';
    const correct = done && (val.trim() === q.answer || (q.altAnswers||[]).includes(val.trim()));
    return `
      <div style="margin-bottom:1rem">
        <div class="quiz-question">${q.q}</div>
        <div class="quiz-hint">${q.hint}</div>
        <div class="fill-input-wrap">
          <input class="fill-input" id="fi-${sc.id}-${qi}" type="text" value="${val}" placeholder="Nhập câu trả lời bằng tiếng Nhật..." ${done?'disabled':''} />
          ${!done ? `<button class="check-btn" onclick="answerFill(${sc.id},${qi})">Kiểm tra</button>` : ''}
        </div>
        <div class="feedback-msg ${done?'show':''} ${correct?'ok':'wrong'}" id="fb-${sc.id}-${qi}">
          ${done ? (correct ? '✓ Chính xác! +10 điểm' : `✗ Chưa đúng. Đáp án đúng: 「${q.answer}」`) : ''}
        </div>
      </div>`;
  }
}

function answerChoice(sid, qi, chosen) {
  if (quizAnswered[sid][qi]) return;
  window[`chosen_${sid}_${qi}`] = chosen;
  quizAnswered[sid][qi] = true;
  const q = scenarios[sid].quiz[qi];
  if (chosen === q.answer) { scores[sid] += 10; updateProgress(); }
  checkAllQuizDone(sid);
  renderContent();
}

function answerFill(sid, qi) {
  const val = document.getElementById(`fi-${sid}-${qi}`).value;
  window[`fill_${sid}_${qi}`] = val;
  quizAnswered[sid][qi] = true;
  const q = scenarios[sid].quiz[qi];
  const correct = val.trim() === q.answer || (q.altAnswers||[]).includes(val.trim());
  if (correct) { scores[sid] += 10; updateProgress(); }
  checkAllQuizDone(sid);
  renderContent();
}

function checkAllQuizDone(sid) {
  if (quizAnswered[sid].every(Boolean)) {
    completed[sid] = true;
    document.getElementById(`dot-${sid}`).style.display = 'block';
    updateProgress();
  }
}

function renderRoleplay(sc) {
  let turns = sc.roleplay.map((t, ti) => {
    const isNV = t.role === 'NV';
    const key = `${sc.id}-${ti}`;
    const revealed = revealedRoleplay[key];
    if (isNV) {
      return `
        <div class="roleplay-turn">
          <div class="turn-label your-turn"><i class="ti ti-user" aria-hidden="true"></i> BẠN (Nhân viên)</div>
          <div class="turn-bubble ${revealed ? 'your-response revealed' : 'hidden-resp'}" onclick="revealTurn('${key}')">${t.jp}
            ${revealed ? `<div style="font-size:11px; margin-top:4px; opacity:0.7">${t.vn}</div>` : ''}
          </div>
        </div>`;
    } else {
      return `
        <div class="roleplay-turn">
          <div class="turn-label their-turn" style="color:var(--gold)"><i class="ti ti-user-circle" aria-hidden="true"></i> KHÁCH</div>
          <div class="turn-bubble customer">${t.jp}
            <div style="font-size:11px; margin-top:3px; opacity:0.7">${t.vn}</div>
          </div>
        </div>`;
    }
  }).join('');

  const allRevealed = sc.roleplay.every((t,ti) => t.role === 'KH' || revealedRoleplay[`${sc.id}-${ti}`]);

  return `
    <div class="learn-section">
      <div class="section-label"><i class="ti ti-theater" aria-hidden="true"></i> ROLEPLAY THỰC TẾ</div>
      <div class="tip-box"><strong>Cách luyện:</strong> Đọc lời khách, sau đó TỰ nói câu trả lời của nhân viên trước khi nhấn xem đáp án. Luyện ít nhất 3 lần!</div>
      <div class="practice-area">
        <div class="practice-header">
          Đối thoại thực hành
          <span class="mode-badge">nhấn ô xanh để xem đáp án</span>
        </div>
        <div class="practice-body">${turns}</div>
      </div>
      ${allRevealed ? `
        <div class="completion-panel show">
          <h3><i class="ti ti-circle-check" aria-hidden="true"></i> Hoàn thành tình huống!</h3>
          <p>Điểm của bạn: <strong>${scores[sc.id]} điểm</strong> — Hãy thử lại để thuần thục hơn nhé!</p>
          <div style="margin-top:0.75rem; display:flex; gap:8px; justify-content:center">
            <button class="btn-secondary" onclick="resetRoleplay(${sc.id})">Làm lại</button>
            ${sc.id < 2 ? `<button class="btn-gold" onclick="switchScenario(${sc.id+1})">Tình huống tiếp →</button>` : ''}
          </div>
        </div>` : ''}
    </div>
    <div class="action-row">
      <button class="btn-secondary" onclick="goStep(3)">← Luyện tập</button>
      ${!allRevealed ? `<button class="btn-primary" onclick="revealAll(${sc.id})">Xem tất cả đáp án</button>` : ''}
    </div>
  `;
}

function revealTurn(key) {
  revealedRoleplay[key] = true;
  renderContent();
}

function revealAll(sid) {
  scenarios[sid].roleplay.forEach((t,ti) => {
    if (t.role === 'NV') revealedRoleplay[`${sid}-${ti}`] = true;
  });
  completed[sid] = true;
  document.getElementById(`dot-${sid}`).style.display = 'block';
  updateProgress();
  renderContent();
}

function resetRoleplay(sid) {
  scenarios[sid].roleplay.forEach((t,ti) => {
    delete revealedRoleplay[`${sid}-${ti}`];
  });
  renderContent();
}

function goStep(s) {
  currentStep = s;
  renderContent();
}

renderContent();
updateProgress();
</script>
